name: Translation Browser Suite

# The full scripted-translation matrix: every route, every analysis tab, desktop and compact viewports.
# Quality Checks gates every pull request on the @smoke subset; this workflow runs the rest nightly, on demand,
# and on pull requests that change rendered UI or the translation test harness.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/components/**"
      - "src/pages/**"
      - "src/comparison/**"
      - "src/utils/text.ts"
      - "scripts/translation-text-rule.mjs"
      - "__tests__/browser/**"
      - "__tests__/translationTestUtils.ts"
      - "__tests__/translationCoverage.ts"
      - "playwright.config.js"
      - ".github/workflows/translation-browser.yml"

concurrency:
  group: translation-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: translation-browser-failures
          path: test-results/
          retention-days: 7
