name: Quality Checks

# engine-next was the integration branch of the optics engine rewrite (OPTICS_ENGINE_REWRITE_SPEC.md, Integration
# model); lens-v2-migration carries its catalog conversion (Phase 2.5). Their pull requests and pushes get the same
# checks as main's; only main deploys.
on:
  pull_request:
    branches: [main, engine-next, lens-v2-migration]
  push:
    branches: [main, engine-next, lens-v2-migration]

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run generate:metadata
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run generate:metadata
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run test
      # The tooling suite, run through Vitest directly: `npm run test:tooling` would first regenerate the
      # metadata that `npm run test` generated in the step above.
      - run: npx vitest run --config vitest.tooling.config.js

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies

  # Tier P of the engine differential harness (agent_docs/architecture/testing.md). Pull requests only: a push to
  # main has nothing to compare with. It is not one of build's needs, so skipping it never skips the build.
  engine-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # HEAD is the merge of the pull request into its base branch, so this merge-base is the commit of that branch
      # it would land on and the diff is the pull request's own change. The harness's own files count, so a change
      # to it runs it.
      - id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base" HEAD -- \
            src/optics src/types src/utils/catalog src/utils/featureFlags.ts \
            src/lens-data ':(exclude,glob)src/lens-data/**/*.md' \
            src/benchmarks/engineDiff scripts/engine-diff.mjs scripts/base-worktree.mjs \
            .github/workflows/quality.yml .github/workflows/engine-diff-stage.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No engine, lens-data or harness path changed; engine-diff did not run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      # The change class and the declared exceptions are read from the API when the job runs, not from the event
      # payload, so re-running the job after the pull request is relabelled or its description edited sees both.
      # No class label means C0.
      - id: declared
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull-request.json"
          classes="$(jq -r '[.labels[].name | select(test("^engine-diff:c[1-3]$")) | sub("^engine-diff:"; "")] | join(" ")' "$RUNNER_TEMP/pull-request.json")"
          case "$classes" in
            "") class=c0 ;;
            *" "*) echo "::error::More than one engine-diff class label: $classes"; exit 1 ;;
            *) class="$classes" ;;
          esac
          echo "class=$class" >> "$GITHUB_OUTPUT"
          jq -r '.body // ""' "$RUNNER_TEMP/pull-request.json" > "$RUNNER_TEMP/pull-request-body.md"
      - if: steps.scope.outputs.run == 'true'
        env:
          BASE: ${{ steps.scope.outputs.base }}
          CHANGE_CLASS: ${{ steps.declared.outputs.class }}
        run: >
          node scripts/engine-diff.mjs --base "$BASE" --tier p --class "$CHANGE_CLASS"
          --exceptions "$RUNNER_TEMP/pull-request-body.md" --out "$RUNNER_TEMP/engine-diff"
      # Only the reports: the payloads beside them are hundreds of megabytes.
      - if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: engine-diff-tier-p
          path: ${{ runner.temp }}/engine-diff/reports
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: [lint-format, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Checks the prerendered head tags, root injection, 404 page, and sitemap in dist/.
      - run: npm run seo:audit
