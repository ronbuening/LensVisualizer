name: Quality Checks

# Integration branches receive the same quality checks as main; only main deploys.
on:
  pull_request:
    branches: [main, engine-next, lens-v2-migration, optics-rewrite/stage-8]
  push:
    branches: [main, engine-next, lens-v2-migration, optics-rewrite/stage-8]
    # Pushes that change only these (the report bot's commits) need no checks and no deploy; nothing built or
    # tested reads them. Pull requests keep no path filter.
    paths-ignore: ["agent_docs/generated/**", "README.md"]

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run generate:metadata
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run generate:metadata
      # generate:metadata has just written src/generated/, so skip the pretypecheck hook that would write it again.
      # --ignore-scripts skips only pre/post hooks; the typecheck script itself still runs.
      - run: npm run typecheck --ignore-scripts

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run test -- --project unit

  test-rims:
    name: test-rims (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            first: rim-0
            second: rim-1
          - group: 2
            first: rim-2
            second: rim-3
          - group: 3
            first: rim-4
            second: rim-5
          - group: 4
            first: rim-6
            second: rim-7
          - group: 5
            first: rim-8
            second: rim-9
          - group: 6
            first: rim-10
            second: rim-11
          - group: 7
            first: rim-12
            second: rim-13
          - group: 8
            first: rim-14
            second: rim-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      # Every lens's beam search depends only on its own data and the code it imports. A pull request that changes
      # neither (Vitest's --changed follows the import graph, including the catalog glob) skips the corpus; pushes,
      # and pull requests touching dependencies, configs or this workflow, which that graph does not see, run all of it.
      # The rim corpus imports nothing from src/generated/, so --ignore-scripts skips the pretest metadata hook. An
      # import added later would fail on the missing file here rather than pass silently, since src/generated/ is not
      # committed.
      - name: Run the rim-cut corpus
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          FIRST: ${{ matrix.first }}
          SECOND: ${{ matrix.second }}
        run: |
          args=(--project "$FIRST" --project "$SECOND")
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "origin/$BASE...HEAD")
            unseen='^(package(-lock)?\.json|vite\.config\.js|vitest\.[a-z]+\.config\.js|tsconfig[^/]*\.json|\.github/workflows/quality\.yml)$'
            if ! grep -qE "$unseen" <<<"$changed"; then args+=(--changed "origin/$BASE" --passWithNoTests); fi
          fi
          npm run test --ignore-scripts -- "${args[@]}"

  test-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      # Like the rim corpus, the tooling suite and the scripts it runs import nothing from src/generated/.
      - run: npm run test:tooling --ignore-scripts

  # Keep the existing required check name; it passes only when every test partition does.
  test:
    if: always()
    needs: [test-unit, test-rims, test-tooling]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test group to pass
        env:
          UNIT_RESULT: ${{ needs.test-unit.result }}
          RIM_RESULT: ${{ needs.test-rims.result }}
          TOOLING_RESULT: ${{ needs.test-tooling.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$RIM_RESULT" = success
          test "$TOOLING_RESULT" = success

  # Pull requests never commit agent_docs/generated/ or the README lens count: refresh-reports.yml writes them on main
  # after merge (agent_docs/decisions.md, 2026-11-27). This job refuses committed output, then regenerates every report
  # into the .reports/ preview and writes what this branch would change to the job summary.
  reports:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse committed report output
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Deletions stay allowed: retiring a generator removes its committed report.
          committed=$(git diff --name-only --diff-filter=d "origin/$BASE...HEAD" -- agent_docs/generated)
          count=$(git diff "origin/$BASE...HEAD" -- README.md | grep -cE '^[-+]- `[0-9]+` visible lens pages are currently published' || true)
          if [ -z "$committed" ] && [ "$count" = 0 ]; then exit 0; fi
          [ -n "$committed" ] && printf 'Committed report output:\n%s\n' "$committed"
          [ "$count" != 0 ] && echo "Changed README lens count line."
          echo "::error::Report output is refreshed on main after merge, never committed in a pull request. Restore it with \`git checkout origin/$BASE -- agent_docs/generated README.md\` (re-apply any README prose edits), \`git rm\` any report this branch added, and commit. Preview with \`npm run generate:reports\` and \`npm run reports:diff\`."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run generate:metadata
      - run: npm run generate:reports
      - run: npm run reports:diff -- --markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report-preview
          path: .reports/
          include-hidden-files: true
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies

  translation-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: translation-browser-failures
          path: test-results/
          retention-days: 7

  # Runs beside the checks rather than after them: deploy.yml already waits for this whole workflow to pass on main.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Checks the prerendered head tags, root injection, 404 page, and sitemap in dist/.
      - run: npm run seo:audit
