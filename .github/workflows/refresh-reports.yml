name: Refresh Generated Reports

# The only writer of agent_docs/generated/ and the README lens count. After each merge to main it regenerates them
# (npm run refresh:reports) and commits the result as the lensvisualizer-reports GitHub App, which is on the
# "Protecting Main" ruleset's bypass list. Pull requests never commit these files: the quality workflow's `reports`
# job refuses them and previews the change instead (agent_docs/decisions.md, 2026-11-27).
#
# The App's ID and private key live in the `reports-bot` environment, which only `main` may use, so no run for a pull
# request or another branch can reach them. Every refresh regenerates everything from the tree it checked out, so a
# superseded or skipped run is made good by the next one.
on:
  push:
    branches: [main]
    # The bot's own commits touch only these paths (and say [skip ci]), so they never trigger this workflow again.
    paths-ignore: ["agent_docs/generated/**", "README.md"]
  workflow_dispatch:
    inputs:
      mtf:
        description: Also run the full MTF chart regression (over half an hour) if its inputs changed
        type: boolean
        default: false
      force_mtf:
        description: Run the full MTF chart regression even if it reads current
        type: boolean
        default: false

permissions:
  contents: read

env:
  BOT_SLUG: lensvisualizer-reports

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: reports-bot
    timeout-minutes: 30
    # A newer merge's run supersedes this one.
    concurrency:
      group: refresh-reports
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # generate:metadata reads the full history for page freshness dates.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run refresh:reports
      - name: Stage the refreshed files
        id: changes
        run: |
          git add agent_docs/generated README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Every report and the README count already match main."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - id: token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.REPORTS_BOT_APP_ID }}
          private-key: ${{ secrets.REPORTS_BOT_PRIVATE_KEY }}
      - name: Commit and push as the App
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          base=$(git rev-parse HEAD)
          id=$(gh api "/users/${BOT_SLUG}[bot]" --jq .id)
          git -c user.name="${BOT_SLUG}[bot]" -c user.email="${id}+${BOT_SLUG}[bot]@users.noreply.github.com" \
            commit --quiet -m "Refresh generated reports [skip ci]" \
            -m "Regenerated by .github/workflows/refresh-reports.yml from $(git rev-parse --short "$base")."
          if git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" HEAD:main; then exit 0; fi
          # A rejection is harmless only when main moved on: that tree gets its own refresh.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$base" ]; then
            echo "::notice::main moved during the refresh; the next refresh regenerates everything from the newer tree."
            exit 0
          fi
          echo "::error::main refused the push. Check that the ${BOT_SLUG} App is on the main ruleset's bypass list with 'Always allow'."
          exit 1

  mtf:
    if: github.event_name == 'workflow_dispatch' && (inputs.mtf || inputs.force_mtf)
    runs-on: ubuntu-latest
    environment: reports-bot
    # The full run took 38 minutes on one core of a 4-vCPU container (2026-11-27).
    timeout-minutes: 150
    # Never cancelled by a newer request: GitHub keeps this run and only the newest waiting one.
    concurrency:
      group: refresh-mtf
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm run refresh:reports -- --mtf ${{ inputs.force_mtf && '--force' || '' }}
      - name: Check for a changed report
        id: changes
        run: |
          if git diff --quiet -- agent_docs/generated/mtf-chart-regression.generated.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Minted after the long run: an App token lasts an hour.
      - id: token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.REPORTS_BOT_APP_ID }}
          private-key: ${{ secrets.REPORTS_BOT_PRIVATE_KEY }}
      - name: Commit on the newest main and push as the App
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          REPORT: agent_docs/generated/mtf-chart-regression.generated.md
        run: |
          # main has usually moved during the run, so the result is carried onto the newest main and its Status line
          # is re-read there (a plain pass) before committing.
          traced=$(git rev-parse --short HEAD)
          installed=$(git rev-parse HEAD)
          cp "$REPORT" "$RUNNER_TEMP/mtf-report.md"
          id=$(gh api "/users/${BOT_SLUG}[bot]" --jq .id)
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            if ! git diff --quiet "$installed" HEAD -- package-lock.json; then
              npm ci
              installed=$(git rev-parse HEAD)
            fi
            cp "$RUNNER_TEMP/mtf-report.md" "$REPORT"
            REPORTS_OUTPUT=tracked npx vitest run --config vitest.reports.config.js mtfChartRegression
            git add "$REPORT"
            if git diff --cached --quiet; then
              echo "main already carries this report."
              exit 0
            fi
            git -c user.name="${BOT_SLUG}[bot]" -c user.email="${id}+${BOT_SLUG}[bot]@users.noreply.github.com" \
              commit --quiet -m "Refresh the MTF chart regression [skip ci]" \
              -m "Full run by .github/workflows/refresh-reports.yml on ${traced}."
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" HEAD:main; then exit 0; fi
            echo "::warning::push attempt ${attempt} was refused; retrying on the newest main."
          done
          echo "::error::could not push the MTF chart regression to main."
          exit 1
